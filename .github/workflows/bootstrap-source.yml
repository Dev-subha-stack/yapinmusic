name: Bootstrap Yapin Music source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore source archive and validate
        shell: bash
        run: |
          set -euo pipefail
          cat .yapin-source/part-*.b64 | tr -d '\r\n' | base64 -d > /tmp/yapin-music.zip
          unzip -t /tmp/yapin-music.zip
          workdir="$(mktemp -d)"
          unzip -q /tmp/yapin-music.zip -d "$workdir"
          rsync -a --delete --exclude='.git/' "$workdir/" ./
          rm -rf .yapin-source upload-smoke-test.txt /tmp/yapin-music.zip "$workdir"
          npm install --no-audit --no-fund
          npm test
          npm run check
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: restore full Yapin Music project"
          git push origin HEAD:main
